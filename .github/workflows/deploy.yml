name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Check code and SQL
        id: statements
        run: node tool/workflow_checks.mjs

      - name: Create test secrets
        run: echo "TOKEN_SECRET=test-secret-ci" > .dev.vars

      - name: Test
        id: test
        run: npx vitest run --reporter=verbose --reporter=json --outputFile=test-results.json

      - name: Save check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: |
            test-results.json
            workflow-checks.json
          retention-days: 30

      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload

      - name: D1 restore point
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: bash tool/d1_migrate.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply stardust-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        id: deploy
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          STATEMENTS_OUTCOME: ${{ steps.statements.outcome }}
          PREVIEW_OUTPUT: ${{ steps.preview.outputs.command-output }}
        with:
          script: |
            const { publishCiComment } = await import(
              require('node:url').pathToFileURL(process.env.GITHUB_WORKSPACE + '/tool/ci_comment.mjs').href
            );
            await publishCiComment({ github, context, core });
