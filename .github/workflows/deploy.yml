name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Create test secrets
        run: echo "TOKEN_SECRET=test-secret-ci" > .dev.vars

      - name: Test
        id: test
        run: npx vitest run --reporter=verbose --reporter=json --outputFile=test-results.json

      - name: Check D1 schema
        if: github.event_name == 'push'
        run: bash tool/check_schema.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply stardust-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Get commit metadata
        id: commit-info
        if: always() && github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "COMMIT_SHA=${HEAD_SHA}" >> $GITHUB_ENV
          echo "COMMIT_SHA_SHORT=${HEAD_SHA::7}" >> $GITHUB_ENV
          echo "COMMIT_AUTHOR=$(git log -1 --format='%an <%ae>' "${HEAD_SHA}")" >> $GITHUB_ENV
          echo "COMMIT_TIME=$(git log -1 --format='%aI' "${HEAD_SHA}")" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$(git log -1 --format='%s' "${HEAD_SHA}")" >> $GITHUB_ENV

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        with:
          script: |
            const fs = require('fs');
            const build = process.env.BUILD_OUTCOME;
            const test  = process.env.TEST_OUTCOME;
            const ok    = build === 'success' && test === 'success';

            // Parse test results JSON
            let testSummaryLine = '';
            let testDetailsRows = '_测试结果文件不可用_';
            try {
              const data = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
              const total  = data.numTotalTests  || 0;
              const passed = data.numPassedTests || 0;
              testSummaryLine = ` — ${passed}/${total} 通过`;
              const rows = [];
              for (const suite of (data.testResults || [])) {
                for (const t of (suite.assertionResults || [])) {
                  const i   = t.status === 'passed' ? '✅' : '❌';
                  const name = [...(t.ancestorTitles || []), t.title].join(' › ');
                  const dur  = t.duration != null ? `${t.duration}ms` : '—';
                  rows.push(`| ${i} | ${name} | ${dur} |`);
                }
              }
              testDetailsRows = rows.length ? rows.join('\n') : '_无测试数据_';
            } catch (e) {}

            // Check .github/ changes and @mention org members
            let warningBlock = '';
            try {
              const { data: files } = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
              const ghChanged = files.filter(f => f.filename.startsWith('.github/')).length;
              if (ghChanged > 0) {
                let mentions = '';
                try {
                  const { data: members } = await github.rest.orgs.listMembers({ org: context.repo.owner });
                  mentions = members.map(m => `@${m.login}`).join(' ');
                } catch (e) {}
                warningBlock = [
                  '',
                  '---',
                  `> ⚠️ **此 PR 修改了 \`.github/\` (${ghChanged} 个文件)，请人工审查 CI/CD 变更**`,
                  mentions ? `> ${mentions}` : '',
                ].filter(Boolean).join('\n');
              }
            } catch (e) {}

            const stepRow = (name, outcome) => {
              const i = outcome === 'success' ? '✅' : outcome === 'failure' ? '❌' : '⏭️';
              return `| ${i} ${name} | \`${outcome}\` |`;
            };

            const body = [
              `<!-- stardust-ci -->`,
              `${ok ? '✅' : '❌'} **CI ${ok ? 'passed' : 'failed'}**${testSummaryLine}`,
              ``,
              `| 步骤 | 结果 |`,
              `| :--- | :--- |`,
              stepRow('Build', build),
              stepRow('Test',  test),
              ``,
              `| 项目 | 详情 |`,
              `| :--- | :--- |`,
              `| Commit | [\`${process.env.COMMIT_SHA_SHORT}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${process.env.COMMIT_SHA}) |`,
              `| 提交时间 | ${process.env.COMMIT_TIME} |`,
              `| 提交者 | ${process.env.COMMIT_AUTHOR} |`,
              `| 提交信息 | ${process.env.COMMIT_MESSAGE} |`,
              ``,
              `<details><summary>测试详情</summary>`,
              ``,
              `| | 测试 | 耗时 |`,
              `| :--- | :--- | ---: |`,
              testDetailsRows,
              ``,
              `</details>`,
              warningBlock,
              ``,
              ok ? `> D1 migrations & Worker 部署将在合并到 main 后自动执行` : `> 请修复上述失败步骤后重新推送`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('<!-- stardust-ci -->')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
