name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Create test secrets
        run: echo "TOKEN_SECRET=test-secret-ci" > .dev.vars

      - name: Test
        id: test
        run: npx vitest run --reporter=verbose --reporter=json --outputFile=test-results.json

      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload worker.js

      - name: D1 restore point
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash tool/d1_migrate.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply stardust-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PREVIEW_OUTPUT: ${{ steps.preview.outputs.command-output }}
        with:
          script: |
            const fs = require('fs');
            const build = process.env.BUILD_OUTCOME;
            const test  = process.env.TEST_OUTCOME;
            const ok    = build === 'success' && test === 'success';

            // Fetch commit metadata via API (git log unreliable in shallow PR checkouts)
            const headSha = context.payload.pull_request.head.sha;
            const { data: commitData } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
            });
            const shaShort     = headSha.slice(0, 7);
            const commitAuthor = `${commitData.commit.author.name} <${commitData.commit.author.email}>`;
            const commitTime   = commitData.commit.author.date;

            // Parse test results JSON
            let testSummaryLine = '';
            let testDetailsRows = '_测试结果文件不可用_';
            try {
              const data = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
              const total  = data.numTotalTests  || 0;
              const passed = data.numPassedTests || 0;
              testSummaryLine = ` — ${passed}/${total} 通过`;
              const rows = [];
              for (const suite of (data.testResults || [])) {
                for (const t of (suite.assertionResults || [])) {
                  const i   = t.status === 'passed' ? '✅' : '❌';
                  const name = [...(t.ancestorTitles || []), t.title].join(' › ');
                  const dur  = t.duration != null ? `${t.duration}ms` : '—';
                  rows.push(`| ${i} | ${name} | ${dur} |`);
                }
              }
              testDetailsRows = rows.length ? rows.join('\n') : '_无测试数据_';
            } catch (e) {}

            // Fetch changed files once, shared by reviewer-assignment and the DB-change row below
            let files = [];
            try {
              const { data } = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
              files = data;
            } catch (e) {}

            // Auto-assign reviewers when sensitive paths change
            let reviewerNote = '';
            try {
              const sensitive = files.some(f =>
                f.filename.startsWith('.github/') ||
                (f.filename.startsWith('test/') && ['modified','removed','renamed','changed'].includes(f.status))
              );
              if (sensitive) {
                const prAuthor = context.payload.pull_request.user.login;
                const { data: contribs } = await github.rest.repos.listContributors({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100,
                });
                const reviewers = contribs
                  .filter(c => c.type !== 'Bot' && c.login !== prAuthor)
                  .map(c => c.login);
                if (reviewers.length) {
                  await github.rest.pulls.requestReviewers({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    reviewers,
                  });
                  reviewerNote = `> ⚠️ 此 PR 修改了敏感路径，已自动分配评审人`;
                }
              }
            } catch (e) {}

            // Preview deployment URL (from `wrangler versions upload`, pull_request only)
            let previewLine = '_未生成（步骤被跳过或失败）_';
            const previewOutput = process.env.PREVIEW_OUTPUT || '';
            const previewMatch = previewOutput.match(/https:\/\/[a-zA-Z0-9.\-]+\.workers\.dev\S*/);
            if (previewMatch) {
              previewLine = previewMatch[0];
            } else if (previewOutput) {
              previewLine = '_未能从输出中提取预览链接，请查看 workflow 日志_';
            }

            // Database migration changes — dev 预览与生产共用同一个 D1，迁移未 apply 时预览可能异常
            const migrationFiles = files.filter(f =>
              f.filename.startsWith('migrations/') &&
              ['added', 'modified', 'renamed', 'changed'].includes(f.status)
            );
            const dbChangeLine = migrationFiles.length
              ? `是（${migrationFiles.map(f => `\`${f.filename}\``).join(', ')}）—— ⚠️ dev 预览的 D1 数据库 schema 可能未同步，相关功能展示可能异常`
              : '无';

            const stepRow = (name, outcome) => {
              const i = outcome === 'success' ? '✅' : outcome === 'failure' ? '❌' : '⏭️';
              return `| ${i} ${name} | \`${outcome}\` |`;
            };

            const body = [
              `<!-- stardust-ci -->`,
              `${ok ? '✅' : '❌'} **CI ${ok ? 'passed' : 'failed'}**${testSummaryLine}`,
              ``,
              `| 步骤 | 结果 |`,
              `| :--- | :--- |`,
              stepRow('Build', build),
              stepRow('Test',  test),
              ``,
              `| 项目 | 详情 |`,
              `| :--- | :--- |`,
              `| Commit | [\`${shaShort}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${headSha}) |`,
              `| 提交时间 | ${commitTime} |`,
              `| 提交者 | ${commitAuthor} |`,
              `| 预览部署 | ${previewLine} |`,
              `| 数据库变更 | ${dbChangeLine} |`,
              ``,
              `<details><summary>测试详情</summary>`,
              ``,
              `| | 测试 | 耗时 |`,
              `| :--- | :--- | ---: |`,
              testDetailsRows,
              ``,
              `</details>`,
              ``,
              ok ? `> D1 migrations & Worker 部署将在合并到 main 后自动执行` : `> 请修复上述失败步骤后重新推送`,
              ...(reviewerNote ? ['', reviewerNote] : []),
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const matches = comments.filter(c =>
              c.user.type === 'Bot' && c.body.includes('<!-- stardust-ci -->')
            );
            for (const stale of matches.slice(1)) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: stale.id,
              });
            }
            if (matches.length > 0) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: matches[0].id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

